<!doctype html><html lang="zh"><meta charset="utf-8"><title>分叉遍历三视图联动</title>
<style>body{font:15px/1.6 system-ui;background:#eef2f6;color:#183047;padding:22px}button,select,input{font:inherit;margin:4px;padding:5px}section{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.panel,.bar{background:white;padding:14px;border:1px solid #ccd6e0;border-radius:8px;margin:10px 0}canvas{width:100%;image-rendering:pixelated;background:#000;cursor:crosshair}pre{white-space:pre-wrap}.note{color:#4a6275}@media(max-width:850px){section{grid-template-columns:1fr}}</style>
<h1 id="title"></h1><p>同一个 XYZ 光标同时映射到 XY、XZ、YZ。点击任一平面更新该平面的两个坐标，第三个坐标保持；MIP 压缩深度，不能仅凭一次点击确定纤维的三维连接。</p>
<div class="bar"><button id="junction">回到分叉 J</button><button id="soma">定位目标胞体 T</button><label><input type="checkbox" id="full">显示完整上游与向前三段</label><label><input type="checkbox" id="overlay">路径假设叠加</label><select id="mode"><option value="slab">5 µm 薄层</option><option value="slice">单层切片</option><option value="mip">整盒 MIP</option></select><label>黑点<input type="number" id="black" value="0" min="0" max="254"></label><label>白点<input type="number" id="white" value="180" min="1" max="255"></label><div id="coordinates"></div></div>
<section id="panels"></section><p class="note">彩线表示当前 SWC 路径假设；三种出口颜色展开到第三段 branch。上游曾被模型保留也不等于目标归属真值。叠加线段按当前薄层裁剪。</p><details><summary>Gemma 对当前出口的判断</summary><pre id="decisions"></pre></details><p><a href="../../index.html">返回实验报告</a></p>
<script>
const data=__DATA__;const $=id=>document.getElementById(id);const values=Uint8Array.from(atob(data.voxels_base64),c=>c.charCodeAt(0));const shape=data.shape_zyx,origin=data.origin_xyz,upper=origin.map((v,i)=>v+shape[2-i]-1);let cursor=data.junction.map(Math.round);
const planes=[{name:'XY',h:0,v:1,d:2},{name:'XZ',h:0,v:2,d:1},{name:'YZ',h:1,v:2,d:0}];
$('title').textContent=data.junction_id+'：回看上游 / 向前连续三段 branch';$('decisions').textContent=JSON.stringify(data.judgments,null,2);
for(let axis=0;axis<3;axis++){const label=document.createElement('label');label.textContent='XYZ'[axis]+' (µm) ';const slider=document.createElement('input');slider.type='range';slider.min=origin[axis];slider.max=upper[axis];slider.value=cursor[axis];slider.id='axis'+axis;const number=document.createElement('input');number.type='number';number.id='number'+axis;number.min=slider.min;number.max=slider.max;number.value=cursor[axis];number.style.width='75px';const update=e=>{cursor[axis]=Math.max(origin[axis],Math.min(upper[axis],Math.round(+e.target.value)));render();};slider.oninput=number.oninput=update;label.append(slider,number);$('coordinates').append(label);}
function bounds(){if($('full').checked)return [origin,upper];const center=data.junction;return [origin.map((v,i)=>Math.max(v,Math.floor(center[i]-24))),upper.map((v,i)=>Math.min(v,Math.ceil(center[i]+24)))];}
function depthBounds(p,lo,hi){if($('mode').value==='mip')return [lo[p.d],hi[p.d]];const radius=$('mode').value==='slice'?0:2;return [Math.max(lo[p.d],cursor[p.d]-radius),Math.min(hi[p.d],cursor[p.d]+radius)];}
function voxel(xyz){const q=xyz.map((v,i)=>v-origin[i]);return values[(q[2]*shape[1]+q[1])*shape[2]+q[0]];}
function clip(a,b,d,low,high){const delta=b[d]-a[d];if(Math.abs(delta)<1e-12)return a[d]>=low&&a[d]<=high?[a,b]:null;let t0=(low-a[d])/delta,t1=(high-a[d])/delta;if(t0>t1)[t0,t1]=[t1,t0];t0=Math.max(0,t0);t1=Math.min(1,t1);if(t0>t1)return null;return [a.map((v,i)=>v+t0*(b[i]-v)),a.map((v,i)=>v+t1*(b[i]-v))];}
for(const p of planes){const panel=document.createElement('div');panel.className='panel';panel.innerHTML='<h2>'+p.name+'</h2><p class="extent"></p><canvas></canvas>';p.canvas=panel.querySelector('canvas');p.label=panel.querySelector('.extent');p.canvas.onclick=e=>{const [lo,hi]=bounds();const r=p.canvas.getBoundingClientRect();cursor[p.h]=Math.max(lo[p.h],Math.min(hi[p.h],Math.floor((e.clientX-r.left)/r.width*(hi[p.h]-lo[p.h]+1))+lo[p.h]));cursor[p.v]=Math.max(lo[p.v],Math.min(hi[p.v],Math.floor((e.clientY-r.top)/r.height*(hi[p.v]-lo[p.v]+1))+lo[p.v]));render();};$('panels').append(panel);}
function render(){const [lo,hi]=bounds(),black=+$('black').value,white=Math.max(black+1,+$('white').value);for(let a=0;a<3;a++){$('axis'+a).value=$('number'+a).value=cursor[a];}
for(const p of planes){const w=hi[p.h]-lo[p.h]+1,h=hi[p.v]-lo[p.v]+1,[d0,d1]=depthBounds(p,lo,hi);const source=document.createElement('canvas');source.width=w;source.height=h;const context=source.getContext('2d'),pixels=context.createImageData(w,h);for(let v=0;v<h;v++)for(let u=0;u<w;u++){const xyz=[0,0,0];xyz[p.h]=lo[p.h]+u;xyz[p.v]=lo[p.v]+v;let maximum=0;for(let d=d0;d<=d1;d++){xyz[p.d]=d;maximum=Math.max(maximum,voxel(xyz));}const grey=Math.round(255*Math.max(0,Math.min(1,(maximum-black)/(white-black)))),i=(v*w+u)*4;pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=grey;pixels.data[i+3]=255;}context.putImageData(pixels,0,0);const scale=Math.max(1,Math.floor(500/Math.max(w,h)));p.canvas.width=w*scale;p.canvas.height=h*scale;const ctx=p.canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(source,0,0,p.canvas.width,p.canvas.height);ctx.scale(scale,scale);ctx.lineWidth=.25;
if($('overlay').checked){for(const track of data.tracks){ctx.strokeStyle=track.color;for(let i=1;i<track.xyz.length;i++){const line=clip(track.xyz[i-1],track.xyz[i],p.d,d0-.5,d1+.5);if(!line)continue;ctx.beginPath();ctx.moveTo(line[0][p.h]-lo[p.h]+.5,line[0][p.v]-lo[p.v]+.5);ctx.lineTo(line[1][p.h]-lo[p.h]+.5,line[1][p.v]-lo[p.v]+.5);ctx.stroke();}}}
const x=cursor[p.h]-lo[p.h]+.5,y=cursor[p.v]-lo[p.v]+.5;ctx.strokeStyle='#ffdd55';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();p.label.textContent='XYZ'[p.h]+'='+cursor[p.h]+', '+'XYZ'[p.v]+'='+cursor[p.v]+'；'+'XYZ'[p.d]+' 投影范围 '+d0+'..'+d1+' µm';}
window.viewerDebug={cursor:cursor.slice(),planes:planes.map(p=>({name:p.name,uv:[cursor[p.h],cursor[p.v]],depth:cursor[p.d]})),origin,shape};document.body.dataset.ready='true';}
$('junction').onclick=()=>{cursor=data.junction.map(Math.round);render();};$('soma').onclick=()=>{$('full').checked=true;cursor=data.target.map(Math.round);render();};for(const id of ['full','overlay','mode','black','white'])$(id).oninput=render;render();
</script></html>
